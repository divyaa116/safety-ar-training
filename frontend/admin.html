<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineGuard Admin</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0c0a09; color:#e7e5e4; font-family:Arial,sans-serif; }
  a { color:#facc15; }
  h1,h2,h3 { margin:0; }
  button, input, select { font-family:inherit; font-size:15px; }
  .btn { padding:9px 14px; border:0; border-radius:8px; background:#facc15; color:#1c1917; font-weight:bold; cursor:pointer; }
  .btn.alt { background:#44403c; color:#fff; } .btn.red { background:#b91c1c; color:#fff; } .btn.green { background:#15803d; color:#fff; } .btn.small { padding:5px 10px; font-size:13px; }
  input, select { padding:10px; border-radius:8px; border:2px solid #57534e; background:#1c1917; color:#fff; width:100%; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px; }
  .card { background:#1c1917; border:2px solid #292524; border-radius:12px; padding:16px; margin-top:14px; }
  .login { max-width:420px; margin:10vh auto 0; }
  .login input { margin-top:10px; } .login .btn { width:100%; margin-top:12px; padding:13px; }
  .msg { min-height:22px; margin-top:8px; font-size:14px; } .bad { color:#fca5a5; } .ok { color:#86efac; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:#1c1917; border-bottom:3px solid #facc15; }
  .top h1 { font-size:18px; color:#facc15; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .tabs button { padding:9px 14px; border:2px solid #44403c; border-radius:8px; background:#1c1917; color:#d6d3d1; font-weight:bold; cursor:pointer; }
  .tabs button.on { background:#facc15; border-color:#facc15; color:#1c1917; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .stat { background:#1c1917; border:2px solid #292524; border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:28px; color:#facc15; } .stat span { color:#a8a29e; font-size:13px; }
  .tablebox { overflow-x:auto; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:#a8a29e; font-weight:normal; padding:8px 6px; border-bottom:2px solid #292524; white-space:nowrap; }
  td { padding:8px 6px; border-bottom:1px solid #292524; vertical-align:top; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#231f1c; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:bold; background:#44403c; }
  .badge.completed,.badge.valid,.badge.active { background:#14532d; color:#bbf7d0; } .badge.in_progress { background:#78350f; color:#fde68a; }
  .badge.revoked,.badge.disabled { background:#7f1d1d; color:#fecaca; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; } .row > * { flex:0 0 auto; } .row .grow { flex:1 1 200px; }
  .modbox { border:2px solid #292524; border-radius:10px; padding:12px; margin-top:10px; }
  .pager { display:flex; gap:10px; align-items:center; margin-top:10px; color:#a8a29e; font-size:14px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:16px; z-index:20; }
  #modal .box { background:#1c1917; border:2px solid #facc15; border-radius:12px; padding:18px; width:100%; max-width:440px; }
  #modal p { color:#d6d3d1; line-height:1.4; } #modal .row { margin-top:12px; justify-content:flex-end; }
  .hide { display:none; }
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <div class="card login">
    <h2 style="color:#facc15">MineGuard Admin</h2>
    <p style="color:#a8a29e;margin:6px 0 0">Administrators only. Sign in to continue.</p>
    <form id="loginForm"><input id="aEmail" type="email" placeholder="Email address" autocomplete="username"><input id="aPass" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" type="submit">Sign in</button></form>
    <div id="loginMsg" class="msg"></div>
    <p style="font-size:13px"><a href="/">Back to the worker site</a></p>
  </div>
</div>

<div id="appView" class="hide">
  <div class="top"><h1>MineGuard Admin</h1><div class="row"><span id="who" style="color:#d6d3d1"></span><a href="/" class="btn alt small" style="text-decoration:none">Worker site</a><button class="btn alt small" id="logoutBtn">Log out</button></div></div>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-tab="overview" class="on">Overview</button><button data-tab="workers">Workers</button><button data-tab="certs">Certificates</button><button data-tab="modules">Modules</button><button data-tab="audit">Audit log</button>
    </div>
    <div id="msgBar" class="msg"></div>

    <div id="tab-overview"><div class="grid" id="stats"></div></div>

    <div id="tab-workers" class="hide">
      <div class="card"><div class="row"><div class="grow"><input id="wSearch" placeholder="Search by name, email or worker ID"></div><button class="btn" id="wGo">Search</button></div>
        <div class="tablebox"><table><thead><tr><th>Name</th><th>Email</th><th>Worker ID</th><th>Training</th><th>Account</th><th>Joined</th></tr></thead><tbody id="wRows"></tbody></table></div>
        <div class="pager"><button class="btn alt small" id="wPrev">Previous</button><span id="wPage"></span><button class="btn alt small" id="wNext">Next</button></div></div>
      <div id="wDetail"></div>
    </div>

    <div id="tab-certs" class="hide">
      <div class="card"><div class="row"><div class="grow"><input id="cSearch" placeholder="Search by certificate ID or name"></div><select id="cStatus" style="width:auto"><option value="">All</option><option value="valid">Valid</option><option value="revoked">Revoked</option></select><button class="btn" id="cGo">Search</button></div>
        <div class="tablebox"><table><thead><tr><th>Certificate ID</th><th>Name</th><th>Training</th><th>Score</th><th>Issued</th><th>Status</th><th></th></tr></thead><tbody id="cRows"></tbody></table></div>
        <div class="pager"><button class="btn alt small" id="cPrev">Previous</button><span id="cPage"></span><button class="btn alt small" id="cNext">Next</button></div></div>
    </div>

    <div id="tab-modules" class="hide"><div class="card" id="modList"></div></div>

    <div id="tab-audit" class="hide"><div class="card"><div class="tablebox"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Worker</th><th>Target</th><th>Details</th></tr></thead><tbody id="aRows"></tbody></table></div></div></div>
  </div>
</div>

<div id="modal"><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><input id="mInput" placeholder="Reason"><div id="mErr" class="msg bad"></div><div class="row"><button class="btn alt" id="mCancel">Cancel</button><button class="btn red" id="mOk">Confirm</button></div></div></div>

<script src="/frontend/js/admin.js"></script>
</body>
</html>
