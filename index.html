<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine Safety Training AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root { --yellow: #facc15; --dark: #1c1917; --rock: #292524; --orange: #ea580c; }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif; margin: 0; padding: 0; color: #f5f5f4;
    background:
      linear-gradient(rgba(28,25,23,0.88), rgba(28,25,23,0.95)),
      repeating-linear-gradient(0deg, #44403c 0px, #44403c 18px, #292524 18px, #292524 36px);
    min-height: 100vh;
  }
  .stripe {
    height: 12px;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 14px, var(--dark) 14px 28px);
  }
  header { background: var(--dark); padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 3px solid var(--yellow); }
  header .icon { font-size: 34px; }
  header h1 { font-size: 18px; margin: 0; color: var(--yellow); letter-spacing: 0.5px; }
  header small { color: #d6d3d1; font-size: 12px; }
  main { padding: 12px 14px 24px; }

  .lang button {
    padding: 8px 16px; margin-right: 8px; border: 2px solid var(--yellow);
    border-radius: 6px; background: transparent; color: var(--yellow); font-size: 15px; font-weight: bold;
  }
  .lang button:active { background: var(--yellow); color: var(--dark); }

  .depth { margin-top: 12px; font-size: 13px; color: #d6d3d1; }
  .depth .track { height: 10px; background: #44403c; border-radius: 5px; margin-top: 4px; overflow: hidden; }
  .depth .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--yellow)); transition: width 0.3s; }

  model-viewer {
    width: 100%; height: 40vh; margin-top: 12px; border-radius: 10px;
    border: 3px solid var(--yellow);
    background: radial-gradient(circle at 50% 40%, #57534e, #1c1917);
  }

  .card {
    margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--rock);
    border-left: 8px solid var(--yellow);
  }
  .card h2 { margin: 0 0 8px; font-size: 19px; color: var(--yellow); }
  .card p { font-size: 17px; line-height: 1.55; margin: 0 0 12px; }
  .card button {
    padding: 10px 16px; border: 0; border-radius: 6px; background: var(--orange);
    color: #fff; font-size: 16px; font-weight: bold;
  }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .nav button {
    padding: 12px 26px; border: 0; border-radius: 6px; background: var(--yellow);
    color: var(--dark); font-size: 20px; font-weight: bold;
  }
  .nav span { color: #d6d3d1; font-size: 15px; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <header>
    <div class="icon">⛑️</div>
    <div>
      <h1 id="title"></h1>
      <small id="sub"></small>
    </div>
  </header>
  <div class="stripe"></div>

  <main>
    <div class="lang">
      <button onclick="setLang('ta')">தமிழ்</button>
      <button onclick="setLang('en')">English</button>
    </div>

    <div class="depth">
      <span id="depthLabel"></span>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>

    <model-viewer src="extinguisher.glb" alt="Fire extinguisher"
      ar ar-modes="webxr scene-viewer" camera-controls auto-rotate>
    </model-viewer>

    <div class="card">
      <h2 id="stepTitle"></h2>
      <p id="stepText"></p>
      <button onclick="speak()">🔊</button>
    </div>

    <div class="nav">
      <button onclick="move(-1)">◀</button>
      <span id="count"></span>
      <button onclick="move(1)">▶</button>
    </div>
  </main>

<script>
const titles = { ta: "சுரங்கப் பாதுகாப்பு பயிற்சி", en: "Mine Safety Training" };
const subs = { ta: "தீ மற்றும் வெடிப்பு பாதுகாப்பு", en: "Fire & Explosion
