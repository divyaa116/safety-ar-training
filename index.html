<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Training AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #fff7ed; }
  h1 { font-size: 20px; }
  model-viewer { width: 100%; height: 60vh; background: #eee; border-radius: 12px; }
</style>
</head>
<body>
  <h1>AR Safety Training - Test</h1>
  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="test model"
    ar
    ar-modes="webxr scene-viewer"
    camera-controls
    auto-rotate>
  </model-viewer>
</body>
</html>
